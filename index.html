<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scanner</title>
    <style>
      :root {
        font-family: "Segoe UI", Tahoma, Arial, sans-serif;
        color: #111;
        background: #f6f5f2;
      }
      body {
        margin: 0;
        padding: 24px;
      }
      #app {
        max-width: 900px;
        margin: 0 auto;
        display: grid;
        gap: 24px;
      }
      section {
        background: #fff;
        border: 1px solid #e4e1dc;
        border-radius: 12px;
        padding: 16px;
      }
      h1 {
        margin: 0;
        font-size: 22px;
      }
      h2 {
        margin: 0 0 12px;
        font-size: 16px;
      }
      label {
        display: block;
        font-size: 13px;
        margin-bottom: 6px;
      }
      input,
      textarea,
      button {
        font: inherit;
      }
      input,
      textarea {
        padding: 8px;
        border-radius: 8px;
        border: 1px solid #cfcac2;
        width: 100%;
        box-sizing: border-box;
      }
      textarea {
        min-height: 100px;
        resize: vertical;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr auto auto auto;
        gap: 8px;
        align-items: center;
      }
      .controls {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .pick-list {
        display: grid;
        gap: 8px;
      }
      .pick-item {
        display: grid;
        grid-template-columns: 1fr auto auto auto;
        gap: 8px;
        align-items: center;
        padding: 8px;
        border: 1px solid #eee8df;
        border-radius: 8px;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono",
          monospace;
      }
      @media (max-width: 700px) {
        .row,
        .pick-item {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
