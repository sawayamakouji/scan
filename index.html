<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JANスキャナー</title>
    <style>
      :root {
        font-family: "Segoe UI", Tahoma, Arial, sans-serif;
        color: #111;
        background: #f6f5f2;
      }
      body {
        margin: 0;
        padding: 24px;
      }
      #app {
        max-width: 900px;
        margin: 0 auto;
        display: grid;
        gap: 24px;
      }
      section {
        background: #fff;
        border: 1px solid #e4e1dc;
        border-radius: 12px;
        padding: 16px;
      }
      h1 {
        margin: 0;
        font-size: 22px;
      }
      h2 {
        margin: 0 0 12px;
        font-size: 16px;
      }
      label {
        display: block;
        font-size: 13px;
        margin-bottom: 6px;
      }
      input,
      textarea,
      button {
        font: inherit;
      }
      input,
      textarea {
        padding: 8px;
        border-radius: 8px;
        border: 1px solid #cfcac2;
        width: 100%;
        box-sizing: border-box;
      }
      textarea {
        min-height: 100px;
        resize: vertical;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr auto auto auto;
        gap: 8px;
        align-items: center;
      }
      .controls {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .pick-list {
        display: grid;
        gap: 8px;
      }
      .camera-wrap {
        position: relative;
      }
      video {
        width: 100%;
        max-height: 280px;
        background: #0e0e0e;
        border-radius: 8px;
      }
      .camera-guide {
        position: absolute;
        inset: 12% 12%;
        border: 2px dashed rgba(255, 255, 255, 0.8);
        border-radius: 8px;
        box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.15);
        pointer-events: none;
      }
      .camera-guide.flash {
        border-color: rgba(46, 204, 113, 0.95);
        box-shadow: 0 0 0 9999px rgba(46, 204, 113, 0.18),
          0 0 14px rgba(46, 204, 113, 0.9);
        animation: scan-flash 240ms ease-out;
      }
      .camera-guide-label {
        position: absolute;
        top: 8px;
        left: 8px;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        font-size: 12px;
        padding: 4px 8px;
        border-radius: 6px;
        pointer-events: none;
      }
      .pick-item {
        display: grid;
        grid-template-columns: 1fr;
        grid-template-rows: auto auto;
        gap: 8px;
        align-items: center;
        padding: 8px;
        border: 1px solid #eee8df;
        border-radius: 8px;
      }
      .pick-item.pick-active {
        grid-template-columns: 1fr;
      }
      .pick-controls {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 8px;
        align-items: center;
      }
      .pick-actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .pickup-complete {
        padding: 10px 14px;
        font-weight: 600;
      }
      .item-name {
        font-size: 29px;
        color: #5c5147;
        margin-top: 2px;
        line-height: 1.3;
      }
      .pick-qty {
        font-size: 24px;
      }
      .completed-at {
        font-size: 12px;
        color: #6d6257;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono",
          monospace;
        font-size: 24px;
      }
      .helper-text {
        font-size: 12px;
        color: #6d6257;
        margin-top: 6px;
      }
      .hidden {
        display: none;
      }
      @keyframes scan-flash {
        0% {
          opacity: 1;
        }
        50% {
          opacity: 0.25;
        }
        100% {
          opacity: 1;
        }
      }
      @media (max-width: 700px) {
        .row,
        .pick-item {
          grid-template-columns: 1fr;
        }
        .pick-controls {
          grid-template-columns: 1fr;
        }
        .pick-actions {
          flex-wrap: nowrap;
        }
        .pick-actions button {
          flex: 1 1 auto;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
